<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCP — Qoima Control Panel</title>
<style>
:root[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg2: #1a1a1a;
  --bg3: #2a2a2a;
  --border: #333;
  --text: #ffffff;
  --text2: #b0b0b0;
  --text3: #666;
  --accent: #0066ff;
  --red: #ff3333;
}

:root[data-theme="light"] {
  --bg: #f8f8f8;
  --bg2: #ffffff;
  --bg3: #f0f0f0;
  --border: #e0e0e0;
  --text: #1a1a1a;
  --text2: #666666;
  --text3: #aaaaaa;
  --accent: #0066ff;
  --red: #ff3333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body { 
  background: var(--bg); 
  color: var(--text); 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
  transition: background 0.3s, color 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.login-container { width: 100%; max-width: 420px; }
.login-box { 
  background: var(--bg2); 
  border: 1px solid var(--border); 
  border-radius: 16px; 
  padding: 40px;
}

.login-header { text-align: center; margin-bottom: 40px; }
.login-logo { 
  width: 60px; 
  height: 60px; 
  background: var(--accent); 
  border-radius: 12px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-weight: 700; 
  color: white; 
  font-size: 20px; 
  margin: 0 auto 20px;
}

.login-title { 
  font-size: 24px; 
  font-weight: 600; 
  margin-bottom: 8px;
}

.login-subtitle { 
  font-size: 13px; 
  color: var(--text3);
}

.form-group { 
  margin-bottom: 20px;
}

.form-label { 
  display: block; 
  font-size: 12px; 
  color: var(--text3); 
  text-transform: uppercase; 
  letter-spacing: 0.5px; 
  margin-bottom: 8px; 
  font-weight: 500;
}

.form-input { 
  width: 100%; 
  padding: 12px 16px; 
  background: var(--bg3); 
  border: 1px solid var(--border); 
  border-radius: 8px; 
  color: var(--text); 
  font-family: inherit; 
  font-size: 14px; 
  transition: all 0.2s;
}

.form-input:focus { 
  outline: none; 
  border-color: var(--accent); 
  box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.1);
}

.form-input::placeholder {
  color: var(--text3);
}

.btn { 
  width: 100%; 
  padding: 12px 20px; 
  border-radius: 8px; 
  border: none; 
  font-family: inherit; 
  font-size: 14px; 
  font-weight: 600; 
  cursor: pointer; 
  transition: all 0.2s;
}

.btn-primary { 
  background: var(--accent); 
  color: white;
}

.btn-primary:hover:not(.loading) { 
  opacity: 0.9;
}

.btn-primary.loading { 
  opacity: 0.5; 
  pointer-events: none;
}

.login-error { 
  padding: 12px 16px; 
  background: rgba(255, 51, 51, 0.1); 
  border: 1px solid var(--red); 
  border-radius: 8px; 
  color: var(--red); 
  font-size: 13px; 
  margin-bottom: 20px;
  display: none;
}

.login-footer { 
  text-align: center; 
  margin-top: 32px; 
  padding-top: 24px; 
  border-top: 1px solid var(--border);
}

.login-support { 
  font-size: 12px; 
  color: var(--text3); 
  margin-bottom: 12px;
}

.login-support a { 
  color: var(--accent); 
  text-decoration: none; 
  transition: color 0.2s;
}

.login-support a:hover { 
  color: #3388ff;
}

.spinner { 
  display: inline-block; 
  width: 14px; 
  height: 14px; 
  border: 2px solid var(--border); 
  border-top-color: var(--accent); 
  border-radius: 50%; 
  animation: spin 0.8s linear infinite; 
  margin-right: 8px;
}

@keyframes spin { 
  to { transform: rotate(360deg); }
}

.theme-toggle-footer {
  text-align: center;
  margin-top: 20px;
}

.theme-toggle {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  font-size: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.theme-toggle:hover {
  border-color: var(--accent);
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">QCP</div>
      <h1 class="login-title">Qoima Control Panel</h1>
      <p class="login-subtitle">Введите учётные данные</p>
    </div>

    <div id="loginError" class="login-error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input 
          type="email" 
          id="emailInput" 
          class="form-input" 
          placeholder="admin@qoima.kz" 
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input 
          type="password" 
          id="passwordInput" 
          class="form-input" 
          placeholder="••••••••" 
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="loginBtnText">Войти</span>
      </button>
    </form>

    <div class="login-footer">
      <div class="login-support">
        Проблемы со входом?<br>
        Напишите нам в <a href="https://instagram.com/akwthecreator" target="_blank">@akwthecreator</a>
      </div>
    </div>

    <div class="theme-toggle-footer">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Переключить тему">🌙</button>
    </div>
  </div>
</div>

<!-- Firebase Compat SDK (v10) — глобальный объект firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<script>
// Firebase Configuration (новый API ключ из Firebase Console)
const firebaseConfig = {
  apiKey: "AIzaSyDJYs_65EzH2WT99YT25reJcczjUZy41Do",
  authDomain: "qos-base.firebaseapp.com",
  projectId: "qos-base",
  storageBucket: "qos-base.firebasestorage.app",
  messagingSenderId: "639485153845",
  appId: "1:639485153845:web:61baa7942382ba7444d77c",
  measurementId: "G-S64SXSC4SR"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// Если пользователь уже залогинен — сразу на панель
auth.onAuthStateChanged(user => {
  if (user) {
    window.location.href = 'panel.html';
  }
});

// Toggle Theme
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme') || 'dark';
  const newTheme = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

// Restore saved theme
window.addEventListener('load', () => {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
});

// Handle Login
async function handleLogin(e) {
  e.preventDefault();
  
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('loginBtnText');
  const errorDiv = document.getElementById('loginError');
  
  errorDiv.style.display = 'none';
  btn.classList.add('loading');
  btnText.innerHTML = '<span class="spinner"></span>Вход...';
  
  try {
    await auth.signInWithEmailAndPassword(email, password);
    // Success - will be redirected by onAuthStateChanged
  } catch (error) {
    let message = 'Ошибка входа';
    
    if (error.code === 'auth/user-not-found') {
      message = 'Пользователь не найден';
    } else if (error.code === 'auth/wrong-password') {
      message = 'Неверный пароль';
    } else if (error.code === 'auth/invalid-email') {
      message = 'Некорректный email';
    } else if (error.code === 'auth/user-disabled') {
      message = 'Аккаунт отключен';
    } else if (error.code === 'auth/too-many-requests') {
      message = 'Слишком много попыток входа. Попробуйте позже';
    } else if (error.code === 'auth/network-request-failed') {
      message = 'Ошибка сети. Проверьте интернет';
    } else {
      message = error.message || 'Неизвестная ошибка';
    }
    
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    
    btn.classList.remove('loading');
    btnText.innerHTML = 'Войти';
  }
}

// Form submit on Enter
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loginForm').addEventListener('submit', handleLogin);
});
</script>
</body>
</html>
