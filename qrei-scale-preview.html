<!DOCTYPE html>
<html lang="ru" data-theme="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шкала QREI</title><style>
:root[data-theme="dark"]{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#2a2a2a;
 --border:#2a2a2a;--border2:#383838;--text:#fff;--text2:#999;--text3:#555;
 --green:#00cc66;--yellow:#ffaa00;--red:#ff3333;--accent:#0066ff}
:root[data-theme="light"]{--bg:#f5f5f5;--bg2:#fff;--bg3:#f0f0f0;--bg4:#e8e8e8;
 --border:#e0e0e0;--border2:#d0d0d0;--text:#111;--text2:#666;--text3:#aaa;
 --green:#00aa55;--yellow:#cc8800;--red:#dd2222;--accent:#0066ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);padding:24px 16px;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5}
.tgl{padding:8px 14px;border-radius:20px;border:1px solid var(--border2);
 background:var(--bg3);color:var(--text2);font:600 12px/1 inherit;cursor:pointer;margin-bottom:20px}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
/* QREI 90-100: анимированный синий градиент. Без glow/box-shadow. */
.qrei-elite{
  background:linear-gradient(110deg,#2f6bff 0%,#00b4ff 22%,#6ea8ff 42%,#00d4ff 62%,#3d7bff 82%,#2f6bff 100%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:qreiFlow 5s linear infinite;
}
.qrei-chip-elite{
  background:linear-gradient(110deg,#2f6bff 0%,#00b4ff 22%,#6ea8ff 42%,#00d4ff 62%,#3d7bff 82%,#2f6bff 100%);
  background-size:300% 100%;
  animation:qreiFlow 5s linear infinite;
  color:#fff;
}
@keyframes qreiFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@media(prefers-reduced-motion:reduce){.qrei-elite,.qrei-chip-elite{animation:none}}
/* ── QREI CARD ── */
.qrei-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:16px;padding:18px;margin-bottom:16px;
}
.qrei-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.qrei-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.qrei-tier{
  display:inline-block;padding:4px 10px;border-radius:20px;
  font-size:12px;font-weight:700;border:1px solid var(--border2);
}
.qrei-tier.qrei-chip-elite{border-color:transparent}
.qrei-score-wrap{display:flex;align-items:baseline;gap:3px;flex-shrink:0}
.qrei-score{font-size:42px;font-weight:900;line-height:1;letter-spacing:-1.5px}
.qrei-max{font-size:13px;color:var(--text3);font-weight:600}
.qrei-bar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:10px}
.qrei-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.qrei-hint{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:16px}
.qrei-hint strong{color:var(--text)}
.qrei-parts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qrei-part{background:var(--bg3);border-radius:12px;padding:12px}
.qrei-part-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:8px}
.qrei-part-name{font-size:11px;color:var(--text3);line-height:1.3}
.qrei-part-val{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.qrei-part-track{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;margin-bottom:6px}
.qrei-part-fill{height:100%;border-radius:2px;background:var(--text2);transition:width .5s ease}
.qrei-part-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}
@media(max-width:400px){ .qrei-parts{grid-template-columns:1fr} }


</style></head><body><div class="wrap">
<h1>Шкала QREI Score</h1>
<div class="sub">Цвета берутся из рабочих файлов — то же самое увидят продавец и менеджер.</div>
<button class="tgl" onclick="var r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark')">Переключить тему</button>

  <div class="qrei-card">
    <div class="qrei-top">
      <div>
        <div class="qrei-label">0 – 49</div>
        <div class="qrei-tier " style="color:var(--red)">Зона риска</div>
      </div>
      <div class="qrei-score-wrap">
        <div class="qrei-score " style="color:var(--red)">38</div>
        <div class="qrei-max">/100</div>
      </div>
    </div>
    <div class="qrei-bar-track"><div class="qrei-bar-fill " style="width:38%;background:var(--red)"></div></div>
  </div>

  <div class="qrei-card">
    <div class="qrei-top">
      <div>
        <div class="qrei-label">50 – 79</div>
        <div class="qrei-tier " style="color:var(--yellow)">Норма</div>
      </div>
      <div class="qrei-score-wrap">
        <div class="qrei-score " style="color:var(--yellow)">66</div>
        <div class="qrei-max">/100</div>
      </div>
    </div>
    <div class="qrei-bar-track"><div class="qrei-bar-fill " style="width:66%;background:var(--yellow)"></div></div>
  </div>

  <div class="qrei-card">
    <div class="qrei-top">
      <div>
        <div class="qrei-label">80 – 89</div>
        <div class="qrei-tier " style="color:var(--green)">Отлично</div>
      </div>
      <div class="qrei-score-wrap">
        <div class="qrei-score " style="color:var(--green)">84</div>
        <div class="qrei-max">/100</div>
      </div>
    </div>
    <div class="qrei-bar-track"><div class="qrei-bar-fill " style="width:84%;background:var(--green)"></div></div>
  </div>

  <div class="qrei-card">
    <div class="qrei-top">
      <div>
        <div class="qrei-label">90 – 100 · ставка 6%</div>
        <div class="qrei-tier qrei-chip-elite" style="">Элита</div>
      </div>
      <div class="qrei-score-wrap">
        <div class="qrei-score qrei-elite" style="">93</div>
        <div class="qrei-max">/100</div>
      </div>
    </div>
    <div class="qrei-bar-track"><div class="qrei-bar-fill qrei-chip-elite" style="width:93%;"></div></div>
  </div>
</div></body></html>
