<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сертификат Qoima</title>
<style>
@font-face {
  font-family: 'TT Octosquares';
  font-weight: 700;
  src: url('https://raw.githubusercontent.com/akwthecreator/QOS/main/TT%20Octosquares%20Trial%20Bold.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'TT Octosquares';
  font-weight: 500;
  src: url('https://raw.githubusercontent.com/akwthecreator/QOS/main/TT%20Octosquares%20Trial%20Medium.ttf') format('truetype');
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: #080808;
  font-family: 'TT Octosquares', monospace;
  cursor: none;
}

/* ─── CUSTOM CURSOR ─── */
.cursor {
  position: fixed; z-index: 9999;
  width: 10px; height: 10px; background: #fff;
  border-radius: 50%; pointer-events: none;
  transform: translate(-50%,-50%);
  transition: transform 0.08s ease, width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%; pointer-events: none;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease, width 0.25s, height 0.25s;
}

/* ─── SCENE ─── */
.scene {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  perspective: 900px; overflow: hidden;
}
.scene::before {
  content: ''; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.028; pointer-events: none; z-index: 0;
}

/* ─── GLOWS ─── */
.glow-a {
  position: absolute; width: 700px; height: 700px; border-radius: 50%;
  background: radial-gradient(circle, rgba(220,180,100,0.055) 0%, transparent 65%);
  top: -200px; left: 50%; transform: translateX(-50%);
  animation: ga 12s ease-in-out infinite; pointer-events: none;
}
.glow-b {
  position: absolute; width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(233,30,36,0.045) 0%, transparent 65%);
  bottom: -150px; right: -100px;
  animation: gb 9s ease-in-out infinite; pointer-events: none;
}
@keyframes ga { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-40px)} }
@keyframes gb { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-30px) rotate(3deg)} }

/* ─── STICKERS ─── */
.sticker {
  position: absolute; border-radius: 4px; cursor: none;
  will-change: transform; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  transition: filter 0.3s; user-select: none; -webkit-user-drag: none; z-index: 2;
}
.sticker:hover { filter: drop-shadow(0 12px 40px rgba(0,0,0,0.8)) brightness(1.08); z-index: 3; }
.sticker img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
.sticker-1 { width: 320px; height: 320px; top: 6%;    left: 4%; }
.sticker-2 { width: 300px; height: 300px; top: 4%;    right: 8%; }
.sticker-3 { width: 340px; height: 340px; bottom: 8%; left: 2%; }
.sticker-4 { width: 310px; height: 310px; bottom: 6%; right: 5%; }
.sticker-5 { width: 320px; height: 320px; top: 4%;    right: 48%; }

/* ─── CERT WRAPPER ─── */
.cert-wrap {
  position: relative; z-index: 10;
  width: min(860px, calc(100vw - 32px));
  transform-style: preserve-3d; will-change: transform; cursor: none;
}

/* ─── CERT CARD ─── */
.cert-card {
  width: 100%; border-radius: 22px; overflow: hidden; background: #f5ede0;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.7), 0 0 120px rgba(201,168,130,0.1);
  transform-style: preserve-3d; opacity: 0;
  animation: cardIn 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;
}
@keyframes cardIn { to { opacity: 1; } }

/* ─── IMAGE AREA — ключевой контейнер, aspect-ratio зафиксирован ─── */
.cert-img-area {
  position: relative; width: 100%;
  padding-bottom: 39.06%; /* точное соотношение шаблона */
  overflow: hidden; background: #f0e8d8;
}
.cert-img-area > img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}

/* ═══════════════════════════════════════════════════════════
   BACK OVERLAY — все элементы абсолютно позиционированы
   в % от cert-img-area, так они всегда совпадают с шаблоном
   на любом экране (desktop, tablet, phone).
   
   Как проверить/подстроить: открой на нужном экране,
   меняй top/left/width у нужного класса.
═══════════════════════════════════════════════════════════ */
.cert-back-overlay {
  position: absolute; inset: 0;
}

/* Имя покупателя */
.back-name {
  position: absolute;
  left: 3.5%;
  top: 62%;
  width: 68%;
  font-family: 'TT Octosquares', monospace;
  font-weight: 500;
  /* vw даёт пропорциональный размер от ширины экрана */
  font-size: clamp(7px, 2.4vw, 22px);
  color: #111;
  letter-spacing: clamp(1px, 0.35vw, 4px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1;
}

/* Сумма — крупная красная */
.back-amount {
  position: absolute;
  left: 3.5%;
  top: 72%;
  width: 66%;
  font-family: 'TT Octosquares', monospace;
  font-weight: 700;
  font-size: clamp(13px, 5.2vw, 54px);
  color: #c0392b;
  line-height: 1;
  letter-spacing: -0.5px;
  white-space: nowrap;
}

/* Прописью */
.back-amount-sub {
  position: absolute;
  left: 3.5%;
  top: 92%;
  width: 60%;
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(3.5px, 0.88vw, 9px);
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
}

/* Дата — правая красная зона */
.back-date {
  position: absolute;
  right: 0%;
  top: 16%;
  width: 21%;
  font-family: 'TT Octosquares', monospace;
  font-weight: 700;
  font-size: clamp(5px, 1.6vw, 15px);
  color: #fff;
  line-height: 1.3;
  text-align: left;
  padding-left: 3.5%;
  word-break: break-word;
}

/* Код — правая красная зона, внизу */
.back-code {
  position: absolute;
  right: 0%;
  top: 88%;
  bottom: 5%;
  width: 21%;
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(4.5px, 1.1vw, 11px);
  color: #E81D25;
  letter-spacing: 0.4px;
  word-break: break-all;
  line-height: 1.4;
  text-align: left;
  padding-left: 3.5%;
}

/* ─── FLIP ─── */
.cert-flipper {
  width: 100%; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.85s cubic-bezier(0.4, 0.2, 0.2, 1);
}
.cert-flipper.flipped { transform: rotateY(180deg); }
.cert-face { width: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.cert-front { position: relative; }
.cert-back  { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }

/* ─── BACK CARD ─── */
.cert-card-back {
  background: #111; border-radius: 22px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.8), 0 0 120px rgba(201,168,130,0.08);
}

/* ─── TAP HINT ─── */
.tap-hint {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 16px; font-size: 11px; color: rgba(255,255,255,0.3);
  letter-spacing: 1px; font-family: 'TT Octosquares', monospace;
  animation: hintPulse 2.5s ease-in-out infinite;
}
.tap-hint-dot {
  width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4);
  animation: dotPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100%{opacity:0.5;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
@keyframes dotPulse  { 0%,100%{background:rgba(255,255,255,0.3)} 50%{background:rgba(255,255,255,0.8)} }

/* ─── LOADING ─── */
.state-overlay {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; color: rgba(255,255,255,0.3);
  font-family: 'TT Octosquares', monospace; font-size: 12px; letter-spacing: 1px;
}
.state-spinner {
  width: 28px; height: 28px;
  border: 2px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.5);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── FOOTER ─── */
.cert-footer {
  position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
  font-size: 10px; color: rgba(255,255,255,0.12);
  font-family: 'TT Octosquares', monospace; letter-spacing: 1px; z-index: 20;
  opacity: 0; animation: fadeUp 0.5s ease 1.2s forwards;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ═══════════════════════════════════════════════
   MOBILE OVERRIDES
   Только корректировка font-size через vw/clamp —
   координаты % остаются теми же, они уже адаптивны.
═══════════════════════════════════════════════ */
@media (max-width: 600px) {
  .sticker-1 { width: 110px; height: 110px; top: 2%;    left: 0%; }
  .sticker-2 { width: 100px; height: 100px; top: 2%;    right: 1%; }
  .sticker-3 { width: 115px; height: 115px; bottom: 10%; left: -2%; }
  .sticker-4 { width: 105px; height: 105px; bottom: 10%; right: -1%; }
  .sticker-5 { width: 100px; height: 100px; top: 2%;    left: 38%; }
  .cert-footer { font-size: 9px; bottom: 10px; }

  /* vw теперь маленький (~375px) — clamp держит минимум */
  .back-name       { font-size: clamp(7px, 3.5vw, 16px); letter-spacing: 1px; }
  .back-amount     { font-size: clamp(14px, 8vw, 36px); }
  .back-amount-sub { font-size: clamp(3.5px, 1.5vw, 8px); }
  .back-date       { font-size: clamp(5px, 2.4vw, 12px); }
  .back-code       { font-size: clamp(4px, 1.8vw, 10px); }
}

@media (max-width: 390px) {
  .back-name       { font-size: clamp(6px, 3.6vw, 13px); top: 53%; }
  .back-amount     { font-size: clamp(13px, 8.5vw, 30px); top: 64%; }
  .back-amount-sub { font-size: clamp(3px, 1.6vw, 7px); top: 83%; }
  .back-date       { font-size: clamp(4.5px, 2.6vw, 11px); }
  .back-code       { font-size: clamp(3.5px, 1.9vw, 9px); }
}
</style>
</head>
<body>

<div class="cursor"      id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="state-overlay" id="stateLoading">
  <div class="state-spinner"></div>
  <div>ЗАГРУЗКА</div>
</div>

<div class="scene" id="mainScene" style="opacity:0;transition:opacity 0.5s ease">

  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <div class="sticker sticker-1" data-speed-x="0.7"  data-speed-y="0.5">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/qsm6_holo.png" alt="">
  </div>
  <div class="sticker sticker-2" data-speed-x="-0.5" data-speed-y="0.8">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/Oiy2_holo.png" alt="">
  </div>
  <div class="sticker sticker-3" data-speed-x="0.4"  data-speed-y="-0.6">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/Orta2_holo.png" alt="">
  </div>
  <div class="sticker sticker-4" data-speed-x="-0.8" data-speed-y="-0.4">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/AlaClub3_holo.png" alt="">
  </div>
  <div class="sticker sticker-5" data-speed-x="0.9"  data-speed-y="0.3">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaCurv_holo.png" alt="">
  </div>

  <div class="cert-wrap" id="certWrap">
    <div class="cert-flipper" id="certFlipper">

      <!-- ЛИЦЕВАЯ СТОРОНА -->
      <div class="cert-face cert-front">
        <div class="cert-card">
          <div class="cert-img-area">
            <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaRakhmetCert.png" alt="Qoima Certificate">
          </div>
        </div>
        <div class="tap-hint" id="tapHint">
          <div class="tap-hint-dot"></div>
          <span>Нажмите чтобы открыть сертификат</span>
        </div>
      </div>

      <!-- ОБРАТНАЯ СТОРОНА -->
      <div class="cert-face cert-back">
        <div class="cert-card-back">
          <div class="cert-img-area">
            <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaCardShablon.png" alt="">

            <!-- Данные поверх шаблона — абсолютные % координаты -->
            <div class="cert-back-overlay">
              <div class="back-name"       id="bName">—</div>
              <div class="back-amount"     id="bAmount">—</div>
              <div class="back-amount-sub" id="bAmountText"></div>
              <div class="back-date"       id="bDateTo">—</div>
              <div class="back-code"       id="bCode">—</div>
            </div>
          </div>
        </div>
        <div class="tap-hint">
          <div class="tap-hint-dot"></div>
          <span>Нажмите снова чтобы перевернуть</span>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="cert-footer">Сертификат выдан магазином Qoima ·</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyDJYs_65EzH2WT99YT25reJcczjUZy41Do",
  authDomain:        "qos-base.firebaseapp.com",
  projectId:         "qos-base",
  storageBucket:     "qos-base.firebasestorage.app",
  messagingSenderId: "639485153845",
  appId:             "1:639485153845:web:61baa7942382ba7444d77c"
});
const db = firebase.firestore();

function numToWords(n) {
  const ones  = ['','БІР','ЕКІ','ҮШ','ТӨРТ','БЕС','АЛТЫ','ЖЕТІ','СЕГІЗ','ТОҒЫЗ'];
  const teens = ['ОН','ОН БІР','ОН ЕКІ','ОН ҮШ','ОН ТӨРТ','ОН БЕС','ОН АЛТЫ','ОН ЖЕТІ','ОН СЕГІЗ','ОН ТОҒЫЗ'];
  const tens  = ['','ОН','ЖИЫРМА','ОТЫЗ','ҚЫРЫҚ','ЕЛУ','АЛПЫС','ЖЕТПІС','СЕКСЕН','ТОҚСАН'];
  function sub(num) {
    let r = '';
    if (num >= 100) { r += ones[Math.floor(num/100)] + ' ЖҮЗ '; num %= 100; }
    if (num >= 20)  { r += tens[Math.floor(num/10)] + ' '; num %= 10; }
    else if (num >= 10) { r += teens[num-10] + ' '; num = 0; }
    if (num > 0) r += ones[num] + ' ';
    return r;
  }
  if (n === 0) return 'НӨЛДІК';
  let result = '';
  if (n >= 1000) { result += sub(Math.floor(n/1000)) + 'МЫҢ '; n %= 1000; }
  result += sub(n);
  return result.trim();
}

function fmtShort(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}.${m}.${y}`;
}

let certLoaded = false;
let isFlipped  = false;

async function loadCert() {
  const code = new URLSearchParams(window.location.search).get('code');
  if (!code) { showScene(); showError('Код не указан в ссылке'); return; }
  try {
    const snap = await db.collection('certificates')
      .where('code','==',code.toUpperCase()).limit(1).get();
    if (snap.empty) { showScene(); showError('Сертификат не найден'); return; }
    renderCert({ id: snap.docs[0].id, ...snap.docs[0].data() });
    certLoaded = true;
  } catch(e) {
    console.error(e); showError('Ошибка загрузки');
  }
  showScene();
}

function renderCert(cert) {
  document.getElementById('bName').textContent       = cert.buyerName || '—';
  document.getElementById('bAmount').textContent     = (cert.amount||0).toLocaleString('ru-RU') + ' ₸';
  document.getElementById('bAmountText').textContent = cert.amount ? numToWords(cert.amount) + ' ТЕҢГЕ КӨЛЕМІНДЕ' : '';
  document.getElementById('bCode').textContent       = cert.code || '—';
  document.getElementById('bDateTo').textContent     = fmtShort(cert.dateTo);
}

function showError(msg) {
  document.getElementById('certFlipper').innerHTML = `
    <div style="padding:60px 40px;text-align:center;color:rgba(255,255,255,0.4);
                font-family:'TT Octosquares',monospace;background:#111;border-radius:22px;
                border:1px solid rgba(255,255,255,0.06)">
      <div style="font-size:40px;margin-bottom:20px">🎫</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:8px">Сертификат не найден</div>
      <div style="font-size:11px;letter-spacing:1px">${msg}</div>
    </div>`;
  const th = document.getElementById('tapHint');
  if (th) th.style.display = 'none';
}

function showScene() {
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('mainScene').style.opacity = '1';
}

function flipCard() {
  if (!certLoaded) return;
  isFlipped = !isFlipped;
  document.getElementById('certFlipper').classList.toggle('flipped', isFlipped);
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime+0.08);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
    osc.start(); osc.stop(ctx.currentTime+0.08);
  } catch(e) {}
}

document.addEventListener('click', flipCard);
document.addEventListener('touchend', e => { e.preventDefault(); flipCard(); }, { passive: false });

// ── PARALLAX ──
const stickers = Array.from(document.querySelectorAll('.sticker'));
const certWrap = document.getElementById('certWrap');
let mx=0, my=0, tx=0, ty=0;
const isMobile = window.matchMedia('(pointer:coarse)').matches;

const seeds = stickers.map(() => ({
  ox: (Math.random()-0.5)*30, oy: (Math.random()-0.5)*20,
  freq:0.0004+Math.random()*0.0004, phase:Math.random()*Math.PI*2,
  rotFreq:0.0003+Math.random()*0.0003, rotAmp:6+Math.random()*8,
  rotPhase:Math.random()*Math.PI*2, scaleFreq:0.0002+Math.random()*0.0003,
  scaleAmp:0.04+Math.random()*0.04,
}));

document.addEventListener('mousemove', e => {
  if (isMobile) return;
  mx = (e.clientX/window.innerWidth-0.5)*2;
  my = (e.clientY/window.innerHeight-0.5)*2;
});

let gyroAsked = false;
function requestGyro() {
  if (!isMobile) return;
  if (typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function') {
    if (!gyroAsked) { gyroAsked=true; DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted')listenGyro();}).catch(()=>{}); }
  } else { listenGyro(); }
}
document.addEventListener('touchstart', requestGyro, { once:true });
function listenGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.beta===null) return;
    mx = Math.max(-1,Math.min(1,(e.gamma||0)/30));
    my = Math.max(-1,Math.min(1,((e.beta||0)-30)/30));
  });
}

const cursor=document.getElementById('cursor'), cursorRing=document.getElementById('cursorRing');
let cx=0, cy=0, crx=0, cry=0;
document.addEventListener('mousemove', e => { cx=e.clientX; cy=e.clientY; });

let lastT=0;
function tick(t) {
  const dt=Math.min(t-lastT,32); lastT=t;
  tx+=(mx-tx)*0.08; ty+=(my-ty)*0.08;
  certWrap.style.transform=`rotateX(${ty*-14}deg) rotateY(${tx*14}deg) translateZ(40px) translateX(${tx*-10}px) translateY(${ty*-6}px)`;
  stickers.forEach((el,i) => {
    const s=seeds[i];
    const sx=parseFloat(el.dataset.speedX)||0.5, sy=parseFloat(el.dataset.speedY)||0.5;
    const lx=s.ox+Math.sin(t*s.freq+s.phase)*18;
    const ly=s.oy+Math.sin(t*s.freq*1.3+s.phase+1)*14;
    const rot=Math.sin(t*s.rotFreq+s.rotPhase)*s.rotAmp;
    const scl=1+Math.sin(t*s.scaleFreq+s.phase)*s.scaleAmp;
    el.style.transform=`translate(${lx+tx*-60*sx}px,${ly+ty*-40*sy}px) rotate(${rot}deg) scale(${scl})`;
  });
  if (!isMobile) {
    crx+=(cx-crx)*0.18; cry+=(cy-cry)*0.18;
    cursor.style.left=cx+'px'; cursor.style.top=cy+'px';
    cursorRing.style.left=crx+'px'; cursorRing.style.top=cry+'px';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(tick);});
if (!isMobile) document.body.style.cursor='none';

loadCert();
</script>
</body>
