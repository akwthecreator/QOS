<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сертификат Qoima</title>
<style>
@font-face {
  font-family: 'TT Octosquares';
  font-weight: 700;
  src: url('https://raw.githubusercontent.com/akwthecreator/QOS/main/TT%20Octosquares%20Trial%20Bold.ttf') format('truetype');
  font-display: swap;
}
@font-face {
  font-family: 'TT Octosquares';
  font-weight: 500;
  src: url('https://raw.githubusercontent.com/akwthecreator/QOS/main/TT%20Octosquares%20Trial%20Medium.ttf') format('truetype');
  font-display: swap;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: #080808;
  font-family: 'TT Octosquares', monospace;
  cursor: none;
}

/* ─── CUSTOM CURSOR ─── */
.cursor {
  position: fixed; z-index: 9999;
  width: 10px; height: 10px;
  background: #fff;
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
  transition: transform 0.08s ease, width 0.2s, height 0.2s;
  mix-blend-mode: difference;
}
.cursor-ring {
  position: fixed; z-index: 9998;
  width: 36px; height: 36px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  pointer-events: none;
  transform: translate(-50%,-50%);
  transition: transform 0.18s ease, width 0.25s, height 0.25s;
}

/* ─── SCENE ─── */
.scene {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  perspective: 900px;
  overflow: hidden;
}
.scene::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.028;
  pointer-events: none; z-index: 0;
}

/* ─── AMBIENT GLOWS ─── */
.glow-a {
  position: absolute;
  width: 700px; height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(220,180,100,0.055) 0%, transparent 65%);
  top: -200px; left: 50%; transform: translateX(-50%);
  animation: ga 12s ease-in-out infinite;
  pointer-events: none;
}
.glow-b {
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(233,30,36,0.045) 0%, transparent 65%);
  bottom: -150px; right: -100px;
  animation: gb 9s ease-in-out infinite;
  pointer-events: none;
}
@keyframes ga { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-40px)} }
@keyframes gb { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-30px) rotate(3deg)} }

/* ─── STICKERS ─── */
.sticker {
  position: absolute;
  border-radius: 4px;
  cursor: none;
  will-change: transform;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  transition: filter 0.3s;
  user-select: none;
  -webkit-user-drag: none;
  z-index: 2;
}
.sticker:hover {
  filter: drop-shadow(0 12px 40px rgba(0,0,0,0.8)) brightness(1.08);
  z-index: 3;
}
.sticker img {
  width: 100%; height: 100%; object-fit: contain;
  display: block; pointer-events: none;
  -webkit-user-drag: none;
}

/* Sticker positions */
.sticker-1 { width: 320px; height: 320px; top: 6%;    left: 4%; }
.sticker-2 { width: 300px; height: 300px; top: 4%;    right: 8%; }
.sticker-3 { width: 340px; height: 340px; bottom: 8%; left: 2%; }
.sticker-4 { width: 310px; height: 310px; bottom: 6%; right: 5%; }
.sticker-5 { width: 320px; height: 320px; top: 4%;    right: 48%; }

/* ─── CERT WRAPPER ─── */
.cert-wrap {
  position: relative; z-index: 10;
  width: min(860px, calc(100vw - 32px));
  transform-style: preserve-3d;
  will-change: transform;
  cursor: none;
}

/* ─── CERT CARD ─── */
.cert-card {
  width: 100%;
  border-radius: 22px;
  overflow: hidden;
  background: #f5ede0;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 30px 80px rgba(0,0,0,0.7),
    0 0 120px rgba(201,168,130,0.1);
  transform-style: preserve-3d;
  opacity: 0;
  animation: cardIn 0.9s cubic-bezier(0.34,1.56,0.64,1) 0.3s forwards;
}
@keyframes cardIn { to { opacity: 1; } }

/* ─── IMAGE AREA ─── */
.cert-img-area {
  position: relative;
  width: 100%;
  padding-bottom: 39.06%;
  overflow: hidden;
  background: #f0e8d8;
}
.cert-img-area img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}

/* ─── FRONT OVERLAY: только брендинг ─── */
.cert-overlay {
  position: absolute; inset: 0;
  padding: 4% 5%;
  display: flex; flex-direction: column; justify-content: space-between;
}
.cert-top-row {
  display: flex; justify-content: space-between; align-items: flex-start;
}
.cert-brand {
  font-size: clamp(10px, 1.6vw, 14px);
  font-weight: 700; letter-spacing: 1.5px; color: #111;
  font-family: 'TT Octosquares', monospace;
}

/* ─── BACK SIDE DATA LAYOUT — pixel-perfect по Figma ─── */
.cert-back-overlay {
  position: absolute; inset: 0;
  display: flex;
}

/* Левая часть: ~78% ширины, бежевая зона */
.back-left {
  flex: 0 0 78%;
  display: flex; flex-direction: column;
  justify-content: center;
  padding: 19% 9% 2% 3%;
  gap: 0;
}
/* Имя — по центру вертикали, курсив, подчёркнутое */
.back-name {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(16px, 2.8vw, 28px);
  color: #111;
  letter-spacing: 4px;
  padding-bottom: 3%;
  margin-bottom: 4%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 92%;
}
/* Сумма — крупная красная */
.back-amount {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(28px, 5.5vw, 54px);
  color: #c0392b; font-weight: 700; line-height: 1;
  margin-bottom: 2%;
  letter-spacing: -1px;
}
/* Прописью — мелко */
.back-amount-sub {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(6px, 0.9vw, 9px);
  color: #666; text-transform: uppercase; letter-spacing: 0.6px;
}

/* Правая часть: ~22% ширины, красная зона */
.back-right {
  flex: 0 0 22%;
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 8% 5% 6%;
}
/* Лейбл даты */
.back-date-label {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(7px, 1vw, 9px);
  color: rgba(255,255,255,0.6);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 4px;
}
/* Дата */
.back-date {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(12px, 2vw, 18px);
  color: #fff; font-weight: 700; line-height: 1.2;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 8%;
  margin-bottom: auto;
}
/* Код сертификата */
.back-code {
  font-family: 'TT Octosquares', monospace;
  font-size: clamp(9px, 1.4vw, 13px);
  color: #f5ede0; font-weight: 800;
  letter-spacing: 1px;
  background: rgba(245,237,224,0.18);
  border: 1px solid rgba(245,237,224,0.25);
  padding: 5px 7px; border-radius: 5px;
  word-break: break-all; line-height: 1.4;
  text-align: center;
}

/* ─── FLIP ─── */
.cert-flipper {
  width: 100%; position: relative;
  transform-style: preserve-3d;
  transition: transform 0.85s cubic-bezier(0.4, 0.2, 0.2, 1);
}
.cert-flipper.flipped { transform: rotateY(180deg); }
.cert-face {
  width: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.cert-front { position: relative; }
.cert-back  { position: absolute; top: 0; left: 0; transform: rotateY(180deg); }

/* ─── BACK CARD ─── */
.cert-card-back {
  background: #111;
  border-radius: 22px; overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 30px 80px rgba(0,0,0,0.8),
    0 0 120px rgba(201,168,130,0.08);
}
/* cert-back-header removed */
.back-status-badge {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  padding: 4px 10px; border-radius: 20px;
  font-family: 'TT Octosquares', monospace;
}
.back-status-badge.active  { background: rgba(0,204,102,0.15); color: #00cc66; border: 1px solid rgba(0,204,102,0.3); }
.back-status-badge.expired { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.1); }
.back-status-badge.revoked { background: rgba(255,51,51,0.15); color: #ff3333; border: 1px solid rgba(255,51,51,0.3); }

/* ─── TAP HINT ─── */
.tap-hint {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 16px;
  font-size: 11px; color: rgba(255,255,255,0.3);
  letter-spacing: 1px; font-family: 'TT Octosquares', monospace;
  animation: hintPulse 2.5s ease-in-out infinite;
}
.tap-hint-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.4);
  animation: dotPulse 2.5s ease-in-out infinite;
}
@keyframes hintPulse { 0%,100%{opacity:0.5;transform:translateY(0)} 50%{opacity:1;transform:translateY(-3px)} }
@keyframes dotPulse  { 0%,100%{background:rgba(255,255,255,0.3)} 50%{background:rgba(255,255,255,0.8)} }

/* ─── LOADING ─── */
.state-overlay {
  position: fixed; inset: 0; z-index: 50;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; color: rgba(255,255,255,0.3);
  font-family: 'TT Octosquares', monospace; font-size: 12px; letter-spacing: 1px;
}
.state-spinner {
  width: 28px; height: 28px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── FOOTER ─── */
.cert-footer {
  position: fixed; bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: 10px; color: rgba(255,255,255,0.12);
  font-family: 'TT Octosquares', monospace; letter-spacing: 1px;
  z-index: 20;
  opacity: 0; animation: fadeUp 0.5s ease 1.2s forwards;
}
.cert-footer a { color: rgba(255,255,255,0.2); text-decoration: none; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ─── MOBILE ─── */
@media (max-width: 600px) {
  .sticker-1 { width: 160px; height: 160px; top: 2%;    left: 0%; }
  .sticker-2 { width: 150px; height: 150px; top: 2%;    right: 1%; }
  .sticker-3 { width: 170px; height: 170px; bottom: 10%; left: -2%; }
  .sticker-4 { width: 155px; height: 155px; bottom: 10%; right: -1%; }
  .sticker-5 { width: 150px; height: 150px; top: 2%;    left: 38%; }
  .cert-footer { font-size: 9px; bottom: 10px; }
}

/* ─── FONTS ─── */
/* Benzin fonts replaced by TT Octosquares */
</style>
</head>
<body>

<div class="cursor"      id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Loading -->
<div class="state-overlay" id="stateLoading">
  <div class="state-spinner"></div>
  <div>ЗАГРУЗКА</div>
</div>

<!-- Main scene (hidden until loaded) -->
<div class="scene" id="mainScene" style="opacity:0;transition:opacity 0.5s ease">

  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <!-- STICKERS -->
  <div class="sticker sticker-1" data-speed-x="0.7"  data-speed-y="0.5">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/qsm6_holo.png" alt="">
  </div>
  <div class="sticker sticker-2" data-speed-x="-0.5" data-speed-y="0.8">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/Oiy2_holo.png" alt="">
  </div>
  <div class="sticker sticker-3" data-speed-x="0.4"  data-speed-y="-0.6">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/Orta2_holo.png" alt="">
  </div>
  <div class="sticker sticker-4" data-speed-x="-0.8" data-speed-y="-0.4">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/AlaClub3_holo.png" alt="">
  </div>
  <div class="sticker sticker-5" data-speed-x="0.9"  data-speed-y="0.3">
    <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaCurv_holo.png" alt="">
  </div>

  <div class="cert-wrap" id="certWrap">
    <div class="cert-flipper" id="certFlipper">

      <!-- ══════════════════════════════════
           ЛИЦЕВАЯ СТОРОНА
           Клиент видит сначала — только картинка-конверт.
           НИКАКИХ данных здесь нет — это сюрприз!
      ══════════════════════════════════ -->
      <div class="cert-face cert-front">
        <div class="cert-card">
          <div class="cert-img-area">
            <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaRakhmetCert.png" alt="Qoima Certificate">

          </div>
        </div>
        <!-- Подсказка "нажмите" -->
        <div class="tap-hint" id="tapHint">
          <div class="tap-hint-dot"></div>
          <span>Нажмите чтобы открыть сертификат</span>

      </div>

      <!-- ══════════════════════════════════
           ОБРАТНАЯ СТОРОНА
           Открывается после клика — здесь все данные
      ══════════════════════════════════ -->
      <div class="cert-face cert-back">
        <div class="cert-card-back">

          <!-- header removed -->

          <!-- Шаблон с данными поверх -->
          <div class="cert-img-area">
            <img src="https://raw.githubusercontent.com/akwthecreator/QOS/main/QoimaCardShablon.png" alt="">
            <div class="cert-back-overlay">
              <!-- Левая зона (~78%) -->
              <div class="back-left">
                <div class="back-name"       id="bName">—</div>
                <div class="back-amount"     id="bAmount">—</div>
                <div class="back-amount-sub" id="bAmountText"></div>
              </div>
              <!-- Правая красная зона (~22%) -->
              <div class="back-right">
                <div class="back-date" id="bDateTo">—</div>
                <div class="back-code" id="bCode">—</div>
              </div>
            </div>
          </div>

        </div>
        <div class="tap-hint">
          <div class="tap-hint-dot"></div>
          <span>Нажмите снова чтобы перевернуть</span>
        </div>
      </div>

    </div><!-- /cert-flipper -->
  </div><!-- /cert-wrap -->

</div><!-- /scene -->

<div class="cert-footer">
  Сертификат выдан магазином Qoima ·
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<script>
// ── FIREBASE ──
firebase.initializeApp({
  apiKey:            "AIzaSyDJYs_65EzH2WT99YT25reJcczjUZy41Do",
  authDomain:        "qos-base.firebaseapp.com",
  projectId:         "qos-base",
  storageBucket:     "qos-base.firebasestorage.app",
  messagingSenderId: "639485153845",
  appId:             "1:639485153845:web:61baa7942382ba7444d77c"
});
const db = firebase.firestore();

// ── HELPERS ──
function numToWords(n) {
  const ones  = ['','БІР','ЕКІ','ҮШ','ТӨРТ','БЕС','АЛТЫ','ЖЕТІ','СЕГІЗ','ТОҒЫЗ'];
  const teens = ['ОН','ОН БІР','ОН ЕКІ','ОН ҮШ','ОН ТӨРТ','ОН БЕС','ОН АЛТЫ','ОН ЖЕТІ','ОН СЕГІЗ','ОН ТОҒЫЗ'];
  const tens  = ['','ОН','ЖИЫРМА','ОТЫЗ','ҚЫРЫҚ','ЕЛУ','АЛПЫС','ЖЕТПІС','СЕКСЕН','ТОҚСАН'];
  function sub(num) {
    let r = '';
    if (num >= 100) { r += ones[Math.floor(num/100)] + ' ЖҮЗ '; num %= 100; }
    if (num >= 20)  { r += tens[Math.floor(num/10)] + ' '; num %= 10; }
    else if (num >= 10) { r += teens[num-10] + ' '; num = 0; }
    if (num > 0) r += ones[num] + ' ';
    return r;
  }
  if (n === 0) return 'НӨЛДІК';
  let result = '';
  if (n >= 1000) { result += sub(Math.floor(n/1000)) + 'МЫҢ '; n %= 1000; }
  result += sub(n);
  return result.trim();
}
function fmtShort(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}.${m}.${y}`;
}
function fmtFull(s) {
  if (!s) return '—';
  return new Date(s+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}

// ── STATE ──
let certLoaded = false;
let isFlipped  = false;

// ── LOAD CERT ──
async function loadCert() {
  const code = new URLSearchParams(window.location.search).get('code');
  if (!code) { showScene(); showError('Код не указан в ссылке'); return; }

  try {
    const snap = await db.collection('certificates')
      .where('code', '==', code.toUpperCase()).limit(1).get();

    if (snap.empty) { showScene(); showError('Сертификат не найден'); return; }

    const cert = { id: snap.docs[0].id, ...snap.docs[0].data() };
    renderCert(cert);
    certLoaded = true;
  } catch(e) {
    console.error(e);
    showError('Ошибка загрузки');
  }
  showScene();
}

function renderCert(cert) {
  const today     = new Date().toISOString().split('T')[0];
  const isExpired = cert.dateTo < today;
  const isRevoked = cert.status === 'revoked';

  // ── Все данные ТОЛЬКО на обратной стороне ──
  document.getElementById('bName').textContent       = cert.buyerName || '—';
  document.getElementById('bAmount').textContent     = (cert.amount||0).toLocaleString('ru-RU') + ' ₸';
  document.getElementById('bAmountText').textContent = cert.amount ? numToWords(cert.amount) + ' ТЕҢГЕ КӨЛЕМІНДЕ' : '';
  document.getElementById('bCode').textContent       = cert.code || '—';
  document.getElementById('bDateTo').textContent     = fmtShort(cert.dateTo);

  // статус-бадж убран
}

function showError(msg) {
  document.getElementById('certFlipper').innerHTML = `
    <div style="padding:60px 40px;text-align:center;color:rgba(255,255,255,0.4);
                font-family:'TT Octosquares', monospace;background:#111;border-radius:22px;
                border:1px solid rgba(255,255,255,0.06)">
      <div style="font-size:40px;margin-bottom:20px">🎫</div>
      <div style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:8px">Сертификат не найден</div>
      <div style="font-size:11px;letter-spacing:1px">${msg}</div>
    </div>`;
  document.getElementById('tapHint') && (document.getElementById('tapHint').style.display = 'none');
}

function showScene() {
  document.getElementById('stateLoading').style.display = 'none';
  document.getElementById('mainScene').style.opacity    = '1';
}

// ── FLIP ──
function flipCard() {
  if (!certLoaded) return;
  isFlipped = !isFlipped;
  document.getElementById('certFlipper').classList.toggle('flipped', isFlipped);
  // Звук щелчка
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.start(); osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

document.addEventListener('click',    flipCard);
document.addEventListener('touchend', e => { e.preventDefault(); flipCard(); }, { passive: false });

// ── PARALLAX ENGINE ──
const stickers = Array.from(document.querySelectorAll('.sticker'));
const certWrap = document.getElementById('certWrap');
let mx=0, my=0, tx=0, ty=0;
const isMobile = window.matchMedia('(pointer:coarse)').matches;

const seeds = stickers.map(() => ({
  ox: (Math.random()-0.5)*30, oy: (Math.random()-0.5)*20,
  freq:     0.0004 + Math.random()*0.0004,
  phase:    Math.random()*Math.PI*2,
  rotFreq:  0.0003 + Math.random()*0.0003,
  rotAmp:   6 + Math.random()*8,
  rotPhase: Math.random()*Math.PI*2,
  scaleFreq:0.0002 + Math.random()*0.0003,
  scaleAmp: 0.04 + Math.random()*0.04,
}));

document.addEventListener('mousemove', e => {
  if (isMobile) return;
  mx = (e.clientX/window.innerWidth  - 0.5)*2;
  my = (e.clientY/window.innerHeight - 0.5)*2;
});

// Gyro for mobile
let gyroAsked = false;
function requestGyro() {
  if (!isMobile) return;
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    if (!gyroAsked) {
      gyroAsked = true;
      DeviceMotionEvent.requestPermission()
        .then(r => { if (r === 'granted') listenGyro(); }).catch(()=>{});
    }
  } else { listenGyro(); }
}
document.addEventListener('touchstart', requestGyro, { once: true });
function listenGyro() {
  window.addEventListener('deviceorientation', e => {
    if (e.beta === null) return;
    mx = Math.max(-1, Math.min(1,  (e.gamma||0)/30));
    my = Math.max(-1, Math.min(1, ((e.beta ||0)-30)/30));
  });
}

// Cursor
const cursor     = document.getElementById('cursor');
const cursorRing = document.getElementById('cursorRing');
let cx=0, cy=0, crx=0, cry=0;
document.addEventListener('mousemove', e => { cx=e.clientX; cy=e.clientY; });

let lastT = 0;
function tick(t) {
  const dt = Math.min(t-lastT, 32); lastT = t;
  tx += (mx-tx)*0.08;
  ty += (my-ty)*0.08;

  // 3D tilt on cert
  certWrap.style.transform = `
    rotateX(${ty*-14}deg) rotateY(${tx*14}deg)
    translateZ(40px)
    translateX(${tx*-10}px) translateY(${ty*-6}px)
  `;

  // Stickers parallax + levitation
  stickers.forEach((el, i) => {
    const s = seeds[i];
    const speedX = parseFloat(el.dataset.speedX)||0.5;
    const speedY = parseFloat(el.dataset.speedY)||0.5;
    const lx  = s.ox + Math.sin(t*s.freq+s.phase)*18;
    const ly  = s.oy + Math.sin(t*s.freq*1.3+s.phase+1)*14;
    const rot = Math.sin(t*s.rotFreq+s.rotPhase)*s.rotAmp;
    const scl = 1+Math.sin(t*s.scaleFreq+s.phase)*s.scaleAmp;
    el.style.transform = `
      translate(${lx+tx*-60*speedX}px, ${ly+ty*-40*speedY}px)
      rotate(${rot}deg) scale(${scl})
    `;
  });

  // Cursor (desktop)
  if (!isMobile) {
    crx += (cx-crx)*0.18; cry += (cy-cry)*0.18;
    cursor.style.left      = cx+'px';  cursor.style.top      = cy+'px';
    cursorRing.style.left  = crx+'px'; cursorRing.style.top  = cry+'px';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(t => { lastT=t; requestAnimationFrame(tick); });
if (!isMobile) document.body.style.cursor = 'none';

// ── GO ──
loadCert();
</script>
</body>
